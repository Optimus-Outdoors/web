<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Title and description are set from content.js — edit them there. -->
<title>Optimus Outdoors</title>
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: #f2ede0; color: #1b2a21; font-family: Archivo, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: #35604a; text-decoration: none; }
  ::selection { background: #cfe0d2; }

  .btn-green { background: #35604a; color: #f7f4ea; }
  .btn-green:hover { background: #22392c; color: #f7f4ea; }
  .btn-cream { background: #f7f4ea; color: #1b2a21; }
  .btn-cream:hover { background: #8dbf9a; color: #1b2a21; }
  .btn-ghost { border: 1px solid rgba(247,244,234,0.45); color: #f7f4ea; }
  .btn-ghost:hover { background: rgba(247,244,234,0.13); color: #f7f4ea; }
  .footer-link:hover { color: #1b2a21; }

  /* Buttons that need to look like the pill links. */
  .btn { font-family: inherit; border: 0; cursor: pointer; }

  /* Native <dialog>: ::backdrop is the grey-out, and showModal() handles
     Esc-to-close and focus trapping. ponytail: no modal library. */
  #contactDialog { border: 0; padding: 0; border-radius: 20px; background: #f7f4ea; color: #1b2a21;
                   width: min(440px, calc(100vw - 32px)); box-shadow: 0 24px 60px rgba(20,32,25,0.28); }
  #contactDialog::backdrop { background: rgba(20,32,25,0.55); backdrop-filter: blur(3px); }
  #contactDialog .body { padding: clamp(22px, 5vw, 32px); }
  .contact-row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
                 padding: 13px 0; border-bottom: 1px solid rgba(27,42,33,0.1); }
  .contact-row:last-child { border-bottom: 0; }
  .contact-row a { font-weight: 600; }
  .contact-row a:hover { text-decoration: underline; }
  .field { display: block; margin-top: 12px; }
  .field span { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.14em;
                text-transform: uppercase; color: rgba(27,42,33,0.55); margin-bottom: 5px; }
  .field input, .field textarea { width: 100%; font-family: inherit; font-size: 15px; color: #1b2a21;
    padding: 11px 13px; border-radius: 10px; background: #fffdf7; border: 1.5px solid rgba(27,42,33,0.16); }
  .field input:focus, .field textarea:focus { outline: 2px solid #35604a; outline-offset: -1px; border-color: #35604a; }
  .field textarea { resize: vertical; min-height: 84px; }
  #formStatus { margin-top: 12px; font-size: 14px; line-height: 1.5; }
  #formStatus[data-state="error"] { color: #8a2b2b; }
  #formStatus[data-state="success"] { color: #35604a; font-weight: 600; }
  /* Formspree's honeypot: bots fill hidden fields, humans never see it. */
  .gotcha { position: absolute; left: -9999px; }

  .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #35604a; }
  .mono-note { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(27,42,33,0.55); }
  .h2 { margin: 14px 0 0; font-size: clamp(30px, 4.6vw, 52px); line-height: 1.02; letter-spacing: -0.03em; font-weight: 700; text-wrap: balance; }
  .section { max-width: 1320px; margin: 0 auto; padding: clamp(56px, 9vw, 104px) 20px 0; }
  /* Grey hatch used for every not-yet-supplied photo. */
  .shot { background: repeating-linear-gradient(135deg, rgba(27,42,33,0.09) 0 12px, rgba(27,42,33,0.03) 12px 24px), #e4dfcd;
          display: flex; align-items: center; justify-content: center; padding: 0 14px; }
  .shot span { font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(27,42,33,0.5); text-align: center; }
  .shot-dark { background: repeating-linear-gradient(135deg, rgba(247,244,234,0.14) 0 12px, rgba(247,244,234,0.05) 12px 24px), #2e4a39; }
  .shot-dark span { color: rgba(233,227,211,0.6); }

  /* Active state rides on aria-pressed, so JS sets one attribute and CSS does the rest. */
  .trim { text-align: left; cursor: pointer; font-family: inherit; color: #1b2a21; padding: 18px 20px;
          border-radius: 16px; transition: all .18s ease; background: #f7f4ea; width: 100%;
          border: 1.5px solid rgba(27,42,33,0.12); box-shadow: none; }
  .trim[aria-pressed="true"] { background: #e6efe6; border-color: #35604a; box-shadow: 0 2px 0 0 #35604a; }
  .swatch { width: 44px; height: 44px; border-radius: 12px; cursor: pointer;
            border: 2px solid rgba(27,42,33,0.14); outline: none; outline-offset: -4px; }
  .swatch[aria-pressed="true"] { border-color: #1b2a21; outline: 2px solid #f7f4ea; }

  /* ponytail: native <details> for the FAQ — no accordion state, no JS. */
  .faq { background: #f7f4ea; border: 1px solid rgba(27,42,33,0.12); border-radius: 14px; overflow: hidden; }
  .faq summary { list-style: none; cursor: pointer; padding: 18px 20px; display: flex; align-items: center;
                 justify-content: space-between; gap: 16px; font-size: 17px; font-weight: 650; }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after { content: '+'; font-family: 'IBM Plex Mono', monospace; font-size: 18px; color: #35604a; flex: 0 0 auto; }
  .faq[open] summary::after { content: '\2013'; }
  .faq p { margin: 0; padding: 0 20px 20px; font-size: 15px; line-height: 1.6;
           color: rgba(27,42,33,0.75); max-width: 62ch; text-wrap: pretty; }

  /* ponytail: media query replaces the original's JS window-resize listener. */
  #navDesktop { display: flex; align-items: center; gap: 26px; }
  #navToggle, #navMobile { display: none; }
  #navMobile.open { display: flex; }
  #navMobile a { padding: 14px 0; font-size: 18px; font-weight: 600; border-bottom: 1px solid rgba(27,42,33,0.08); }
  #navMobile a:last-child { border-bottom: 0; }
  /* Sits above the home indicator on notched devices. The background is NOT
     extended below the bar — doing that painted a visible cream slab on
     Chrome iOS when its toolbar collapsed. */
  .sticky-cta { padding-bottom: env(safe-area-inset-bottom, 0px); }

  /* The wordmark is the only flexible item in the header, so it absorbs the
     squeeze instead of pushing the Reserve button and hamburger off-screen. */
  .brand { flex: 0 1 auto; min-width: 0; }
  .brand-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

  @media (max-width: 859px) {
    #navDesktop { display: none; }
    #navToggle { display: flex; }
    .header-bar { gap: 10px !important; padding-left: 14px !important; padding-right: 14px !important; }
    .brand-name { font-size: 16px; }
  }
  @media (max-width: 380px) {
    .brand-name { font-size: 14px; }
    .header-cta { padding: 10px 14px !important; font-size: 12px !important; }
  }
</style>
</head>
<body>
<div style="width: 100%; overflow-x: clip; background: #f2ede0;">

  <div style="background: #22392c; color: #e9e3d3; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 9px 16px; text-align: center;">
    <span style="width: 6px; height: 6px; border-radius: 50%; background: #8dbf9a; flex: 0 0 auto;"></span>
    <span data-c="banner"></span>
  </div>

  <header style="position: sticky; top: 0; z-index: 40; background: rgba(242,237,224,0.92); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(27,42,33,0.12);">
    <div class="header-bar" style="max-width: 1320px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; gap: 20px;">
      <a href="#top" class="brand" style="display: flex; align-items: center; gap: 10px;">
        <span style="width: 26px; height: 26px; border-radius: 7px; background: #35604a; display: block; flex: 0 0 auto;"></span>
        <span class="brand-name" data-c="site.wordmark" style="font-weight: 800; font-size: 19px; letter-spacing: -0.02em; color: #1b2a21;"></span>
      </a>
      <nav id="navDesktop" style="margin-left: 18px; font-size: 14px; font-weight: 500; flex: 1 1 auto;"></nav>
      <div style="display: flex; align-items: center; gap: 10px; flex: 0 0 auto; margin-left: auto;">
        <button type="button" class="btn btn-green header-cta" data-open-contact data-c="reserveLabel" style="padding: 11px 18px; border-radius: 999px; font-size: 13px; font-weight: 600;"></button>
        <button type="button" id="navToggle" aria-label="Menu" aria-expanded="false" aria-controls="navMobile" style="width: 42px; height: 42px; border: 1px solid rgba(27,42,33,0.18); border-radius: 12px; background: transparent; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer;">
          <span style="width: 16px; height: 2px; background: #1b2a21; display: block;"></span>
          <span style="width: 16px; height: 2px; background: #1b2a21; display: block;"></span>
          <span style="width: 16px; height: 2px; background: #1b2a21; display: block;"></span>
        </button>
      </div>
    </div>
    <nav id="navMobile" style="border-top: 1px solid rgba(27,42,33,0.12); background: #f7f4ea; padding: 8px 20px 18px; flex-direction: column;"></nav>
  </header>

  <section id="top" style="max-width: 1320px; margin: 0 auto; padding: 22px 20px 0;">
    <div style="position: relative; border-radius: 22px; overflow: hidden; background: repeating-linear-gradient(135deg, rgba(27,42,33,0.09) 0 12px, rgba(27,42,33,0.03) 12px 24px), #ded8c6; min-height: clamp(360px, 62vh, 640px); display: flex; flex-direction: column; justify-content: flex-end;">
      <div style="position: absolute; top: 16px; left: 16px; right: 16px; display: flex; justify-content: flex-start;">
        <span data-c="hero.photoNote" style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(27,42,33,0.55); background: rgba(247,244,234,0.8); padding: 7px 12px; border-radius: 6px;"></span>
      </div>
      <div style="position: relative; padding: clamp(64px, 12vw, 130px) clamp(20px, 4vw, 44px) clamp(20px, 4vw, 44px); background: linear-gradient(to top, rgba(20,32,25,0.95) 0%, rgba(20,32,25,0.92) 40%, rgba(20,32,25,0.82) 65%, rgba(20,32,25,0.45) 85%, rgba(20,32,25,0) 100%);">
        <div data-c="hero.eyebrow" class="eyebrow" style="color: #cfe0d2; margin-bottom: 12px;"></div>
        <h1 data-c="hero.title" style="margin: 0; font-size: clamp(40px, 8vw, 92px); line-height: 0.94; letter-spacing: -0.035em; font-weight: 800; color: #f7f4ea; text-wrap: balance;"></h1>
        <p data-c="hero.body" style="margin: 14px 0 0; max-width: 520px; font-size: clamp(15px, 2.2vw, 19px); line-height: 1.5; color: rgba(247,244,234,0.82); text-wrap: pretty;"></p>
        <div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px;">
          <a href="#build" class="btn-cream" data-c="hero.primaryCta" style="padding: 15px 26px; border-radius: 999px; font-weight: 700; font-size: 15px;"></a>
          <a href="#specs" class="btn-ghost" data-c="hero.secondaryCta" style="padding: 15px 26px; border-radius: 999px; font-weight: 600; font-size: 15px;"></a>
        </div>
      </div>
    </div>
    <div id="heroStats" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: rgba(27,42,33,0.12); border: 1px solid rgba(27,42,33,0.12); border-radius: 16px; overflow: hidden; margin-top: 14px;"></div>
  </section>

  <section id="build" class="section">
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: clamp(24px, 4vw, 56px); align-items: start;">
      <div>
        <div data-c="build.eyebrow" class="eyebrow"></div>
        <h2 data-c="build.heading" class="h2"></h2>
        <p data-c="build.body" style="margin: 16px 0 0; font-size: 17px; line-height: 1.6; color: rgba(27,42,33,0.72); max-width: 46ch; text-wrap: pretty;"></p>
        <div id="trimList" style="display: flex; flex-direction: column; gap: 12px; margin-top: 28px;"></div>
      </div>
      <div style="background: #f7f4ea; border: 1px solid rgba(27,42,33,0.12); border-radius: 20px; padding: clamp(18px, 3vw, 28px);">
        <div class="shot" style="border-radius: 14px; overflow: hidden; aspect-ratio: 4 / 3;"><span id="trimShot"></span></div>
        <div data-c="colorwayLabel" class="mono-note" style="margin: 22px 0 10px;"></div>
        <div id="cwList" style="display: flex; flex-wrap: wrap; gap: 10px;"></div>
        <div id="cwName" style="margin-top: 12px; font-size: 14px; font-weight: 600;"></div>
        <div style="height: 1px; background: rgba(27,42,33,0.12); margin: 22px 0;"></div>
        <div id="trimIncludes" style="display: flex; flex-direction: column; gap: 10px;"></div>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 26px;">
          <button type="button" id="reserveBtn" class="btn btn-green" data-open-contact style="padding: 14px 24px; border-radius: 999px; font-weight: 700; font-size: 15px; flex: 1 1 160px; text-align: center;"></button>
          <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: rgba(27,42,33,0.6); line-height: 1.5;"><span id="trimPrice"></span><br><span data-c="depositNote"></span></div>
        </div>
      </div>
    </div>
  </section>

  <section id="features" class="section">
    <div data-c="features.eyebrow" class="eyebrow"></div>
    <h2 data-c="features.heading" class="h2" style="margin-bottom: 34px; max-width: 22ch;"></h2>
    <div id="featureGrid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px;"></div>
  </section>

  <section id="interior" style="margin-top: clamp(56px, 9vw, 104px); background: #22392c; color: #e9e3d3;">
    <div style="max-width: 1320px; margin: 0 auto; padding: clamp(48px, 8vw, 96px) 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: clamp(28px, 4vw, 60px); align-items: center;">
      <div>
        <div data-c="interior.eyebrow" class="eyebrow" style="color: #8dbf9a;"></div>
        <h2 data-c="interior.heading" class="h2" style="color: #f7f4ea;"></h2>
        <p data-c="interior.body" style="margin: 16px 0 0; font-size: 17px; line-height: 1.6; color: rgba(233,227,211,0.78); max-width: 44ch; text-wrap: pretty;"></p>
        <div id="interiorPoints" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 18px; margin-top: 32px;"></div>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div class="shot shot-dark" style="grid-column: span 2; border-radius: 18px; aspect-ratio: 16 / 10;"><span data-c="interior.photoNotes.0"></span></div>
        <div class="shot shot-dark" style="border-radius: 18px; aspect-ratio: 1 / 1;"><span data-c="interior.photoNotes.1"></span></div>
        <div class="shot shot-dark" style="border-radius: 18px; aspect-ratio: 1 / 1;"><span data-c="interior.photoNotes.2"></span></div>
      </div>
    </div>
  </section>

  <section id="specs" class="section">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 18px;">
      <div>
        <div data-c="specs.eyebrow" class="eyebrow"></div>
        <h2 data-c="specs.heading" class="h2"></h2>
      </div>
      <div data-c="specs.note" style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(27,42,33,0.55);"></div>
    </div>
    <div id="specTable" style="margin-top: 28px; border: 1px solid rgba(27,42,33,0.12); border-radius: 18px; overflow: hidden; background: #f7f4ea;"></div>
  </section>

  <section id="faq" style="max-width: 900px; margin: 0 auto; padding: clamp(56px, 9vw, 104px) 20px 0;">
    <h2 data-c="faq.heading" style="margin: 0 0 26px; font-size: clamp(28px, 4.2vw, 44px); line-height: 1.05; letter-spacing: -0.03em; font-weight: 700;"></h2>
    <div id="faqList" style="display: flex; flex-direction: column; gap: 10px;"></div>
  </section>

  <section style="max-width: 1320px; margin: clamp(56px, 9vw, 104px) auto 0; padding: 0 20px;">
    <div style="border-radius: 22px; background: #35604a; color: #f7f4ea; padding: clamp(32px, 6vw, 72px); display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 26px; align-items: center;">
      <div>
        <h2 data-c="cta.heading" style="margin: 0; font-size: clamp(28px, 4.4vw, 46px); line-height: 1.03; letter-spacing: -0.03em; font-weight: 700; text-wrap: balance;"></h2>
        <p data-c="cta.body" style="margin: 14px 0 0; font-size: 17px; line-height: 1.6; color: rgba(247,244,234,0.82); max-width: 40ch;"></p>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 12px;">
        <a href="#top" class="btn-cream" data-c="cta.primary" style="padding: 15px 26px; border-radius: 999px; font-weight: 700; font-size: 15px;"></a>
        <a href="#top" class="btn-ghost" data-c="cta.secondary" style="padding: 15px 26px; border-radius: 999px; font-weight: 600; font-size: 15px;"></a>
      </div>
    </div>
  </section>

  <footer style="max-width: 1320px; margin: 0 auto; padding: clamp(40px, 6vw, 72px) 20px clamp(60px, 12vw, 90px);">
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 28px; padding-bottom: 28px; border-bottom: 1px solid rgba(27,42,33,0.12);">
      <div>
        <div style="display: flex; align-items: center; gap: 10px;">
          <span style="width: 22px; height: 22px; border-radius: 6px; background: #35604a; display: block;"></span>
          <span data-c="site.wordmark" style="font-weight: 800; font-size: 17px; letter-spacing: -0.02em;"></span>
        </div>
        <p data-c="footer.blurb" style="margin: 12px 0 0; font-size: 14px; line-height: 1.55; color: rgba(27,42,33,0.6); max-width: 30ch;"></p>
      </div>
      <div id="footerCols" style="display: contents;"></div>
    </div>
    <div data-c="footer.copyright" style="padding-top: 18px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: rgba(27,42,33,0.5);"></div>
  </footer>

  <div class="sticky-cta" style="position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: rgba(247,244,234,0.95); backdrop-filter: blur(10px); border-top: 1px solid rgba(27,42,33,0.14);">
    <div style="max-width: 1320px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 14px;">
      <div style="flex: 1 1 auto; min-width: 0;">
        <div id="stickyName" style="font-size: 15px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></div>
        <div id="stickyMeta" style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: rgba(27,42,33,0.6);"></div>
      </div>
      <button type="button" class="btn btn-green" data-open-contact data-c="reserveLabel" style="padding: 12px 22px; border-radius: 999px; font-weight: 700; font-size: 14px; flex: 0 0 auto;"></button>
    </div>
  </div>

  <dialog id="contactDialog" aria-labelledby="contactHeading">
    <div class="body">
      <h2 id="contactHeading" data-c="contact.heading" style="margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.02em;"></h2>
      <p data-c="contact.blurb" style="margin: 10px 0 0; font-size: 15px; line-height: 1.55; color: rgba(27,42,33,0.72);"></p>
      <div style="margin: 20px 0 4px; padding: 12px 14px; border-radius: 12px; background: #e6efe6;">
        <div data-c="contact.selectedLabel" class="mono-note"></div>
        <div id="contactSelection" style="margin-top: 4px; font-size: 15px; font-weight: 600;"></div>
      </div>
      <div id="contactMethods" style="margin-top: 12px;"></div>

      <!-- Hidden until contact.formEndpoint is filled in. -->
      <form id="contactForm" hidden style="margin-top: 18px; padding-top: 16px; border-top: 1px solid rgba(27,42,33,0.12);">
        <label class="field"><span data-c="contact.form.nameLabel"></span>
          <input name="name" type="text" required autocomplete="name"></label>
        <label class="field"><span data-c="contact.form.emailLabel"></span>
          <input name="email" type="email" required autocomplete="email"></label>
        <label class="field"><span data-c="contact.form.messageLabel"></span>
          <textarea name="message" required></textarea></label>
        <input class="gotcha" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
        <input type="hidden" name="selection" id="formSelection">
        <button type="submit" id="formSubmit" class="btn btn-green" data-c="contact.form.submitLabel"
                style="margin-top: 16px; width: 100%; padding: 13px; border-radius: 999px; font-weight: 700; font-size: 15px;"></button>
        <div id="formStatus" role="status" aria-live="polite"></div>
      </form>

      <button type="button" id="contactClose" class="btn" data-c="contact.closeLabel"
              style="margin-top: 14px; width: 100%; padding: 12px; border-radius: 999px; font-weight: 600; font-size: 15px; background: transparent; color: rgba(27,42,33,0.7); border: 1px solid rgba(27,42,33,0.2);"></button>
    </div>
  </dialog>
</div>

<script src="content.js"></script>
<script>
/* Renders content.js into the skeleton above. You should not need to edit
   this file to change wording — all text lives in content.js. */

const MONO = "font-family: 'IBM Plex Mono', monospace;";
const el = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// 'interior.photoNotes.0' -> CONTENT.interior.photoNotes[0]
const get = path => path.split('.').reduce((o, k) => (o == null ? o : o[k]), CONTENT);

document.title = CONTENT.site.tabTitle;
document.querySelector('meta[name="description"]').content = CONTENT.site.description;

// Every element carrying data-c gets its text from that path in content.js.
document.querySelectorAll('[data-c]').forEach(node => {
  const value = get(node.dataset.c);
  if (value == null) { console.warn('content.js has no value for:', node.dataset.c); return; }
  node.textContent = value;
});

const navLinks = CONTENT.nav.map(n => `<a href="${esc(n.href)}" style="color:#1b2a21;">${esc(n.label)}</a>`).join('');
el('navDesktop').innerHTML = navLinks;
el('navMobile').innerHTML = navLinks;

el('heroStats').innerHTML = CONTENT.hero.stats.map(s => `
  <div style="background:#f7f4ea;padding:18px 20px;">
    <div style="font-size:clamp(22px,3vw,30px);font-weight:700;letter-spacing:-0.02em;">${esc(s.value)}</div>
    <div class="mono-note" style="margin-top:6px;">${esc(s.label)}</div>
  </div>`).join('');

el('featureGrid').innerHTML = CONTENT.features.items.map(f => `
  <div style="background:#f7f4ea;border:1px solid rgba(27,42,33,0.12);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;">
    <div class="shot" style="aspect-ratio:5/4;"><span>${esc(f.photoNote)}</span></div>
    <div style="padding:20px 20px 24px;">
      <h3 style="margin:0;font-size:19px;font-weight:700;letter-spacing:-0.01em;">${esc(f.title)}</h3>
      <p style="margin:8px 0 0;font-size:15px;line-height:1.55;color:rgba(27,42,33,0.72);text-wrap:pretty;">${esc(f.body)}</p>
    </div>
  </div>`).join('');

el('interiorPoints').innerHTML = CONTENT.interior.points.map(p => `
  <div style="border-top:1px solid rgba(233,227,211,0.25);padding-top:12px;">
    <div style="font-size:17px;font-weight:700;color:#f7f4ea;">${esc(p.title)}</div>
    <div style="font-size:14px;line-height:1.5;color:rgba(233,227,211,0.7);margin-top:4px;">${esc(p.body)}</div>
  </div>`).join('');

el('specTable').innerHTML = CONTENT.specs.rows.map(([label, value]) => `
  <div style="display:flex;flex-wrap:wrap;gap:6px 24px;justify-content:space-between;padding:16px 20px;border-bottom:1px solid rgba(27,42,33,0.08);">
    <span style="${MONO}font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:rgba(27,42,33,0.6);">${esc(label)}</span>
    <span style="font-size:16px;font-weight:600;">${esc(value)}</span>
  </div>`).join('');

el('faqList').innerHTML = CONTENT.faq.items.map((f, i) => `
  <details class="faq"${i === 0 ? ' open' : ''}>
    <summary>${esc(f.q)}</summary>
    <p>${esc(f.a)}</p>
  </details>`).join('');

el('footerCols').innerHTML = CONTENT.footer.columns.map(col => `
  <div>
    <div class="mono-note" style="margin-bottom:12px;">${esc(col.title)}</div>
    <div style="display:flex;flex-direction:column;gap:8px;">
      ${col.links.map(l => `<a class="footer-link" href="#top" style="font-size:14px;color:rgba(27,42,33,0.8);">${esc(l)}</a>`).join('')}
    </div>
  </div>`).join('');

el('trimList').innerHTML = CONTENT.trims.map((t, i) => `
  <button type="button" class="trim" data-trim="${i}" aria-pressed="false">
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:14px;">
      <span style="font-size:20px;font-weight:700;letter-spacing:-0.01em;">${esc(t.name)}</span>
      <span style="${MONO}font-size:13px;color:rgba(27,42,33,0.7);">${esc(t.price)}</span>
    </div>
    <div style="margin-top:6px;font-size:14px;line-height:1.5;color:rgba(27,42,33,0.7);">${esc(t.blurb)}</div>
  </button>`).join('');

el('cwList').innerHTML = CONTENT.colorways.map((c, i) =>
  `<button type="button" class="swatch" data-cw="${i}" aria-pressed="false" title="${esc(c.name)}" aria-label="${esc(c.name)}" style="background:${esc(c.hex)};"></button>`).join('');

// A method with an empty href is plain text rather than a dead link.
el('contactMethods').innerHTML = CONTENT.contact.methods.map(m => `
  <div class="contact-row">
    <span class="mono-note">${esc(m.label)}</span>
    ${m.href
      ? `<a href="${esc(m.href)}"${/^https?:/.test(m.href) ? ' target="_blank" rel="noopener"' : ''}>${esc(m.value)}</a>`
      : `<span style="font-weight:600;">${esc(m.value)}</span>`}
  </div>`).join('');

// The form stays hidden until an endpoint is configured, so an unconfigured
// site shows the email/instagram rows rather than a form that goes nowhere.
const FORM = CONTENT.contact.form;
const endpoint = (CONTENT.contact.formEndpoint || '').trim();
const contactForm = el('contactForm');
if (endpoint) {
  contactForm.hidden = false;
  contactForm.action = endpoint;
  contactForm.method = 'POST';
  contactForm.querySelector('textarea').placeholder = FORM.messageHint || '';

  contactForm.addEventListener('submit', async e => {
    e.preventDefault();
    const status = el('formStatus'), submit = el('formSubmit');
    submit.disabled = true;
    status.dataset.state = 'sending';
    status.textContent = FORM.sendingLabel;
    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        body: new FormData(contactForm),
        headers: { Accept: 'application/json' },
      });
      if (!res.ok) throw new Error(res.status);
      contactForm.reset();
      status.dataset.state = 'success';
      status.textContent = FORM.successLabel;
    } catch (err) {
      // Network failure or a non-2xx from the form service.
      console.error('contact form:', err);
      status.dataset.state = 'error';
      status.textContent = FORM.errorLabel;
    } finally {
      submit.disabled = false;
    }
  });
}

// Clamped so a bad defaultTrim in content.js can't blank the panel.
let trim = Math.min(Math.max(CONTENT.defaultTrim | 0, 0), CONTENT.trims.length - 1);
let cw = 0;

// Everything downstream of the two selections.
function render() {
  const t = CONTENT.trims[trim], c = CONTENT.colorways[cw];
  el('trimShot').textContent = t.photoNote;
  el('trimPrice').textContent = t.price;
  el('reserveBtn').textContent = CONTENT.reservePrefix + t.name;
  el('cwName').textContent = c.name;
  el('stickyName').textContent = CONTENT.site.model + ' ' + t.name;
  el('stickyMeta').textContent = t.price + ' · ' + c.name;
  const selection = CONTENT.site.model + ' ' + t.name + ' · ' + c.name + ' · ' + t.price;
  el('contactSelection').textContent = selection;
  el('formSelection').value = selection;   // rides along with the enquiry
  el('trimIncludes').innerHTML = t.includes.map(line => `
    <div style="display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.45;">
      <span style="width:6px;height:6px;border-radius:50%;background:#35604a;margin-top:7px;flex:0 0 auto;"></span>
      <span>${esc(line)}</span>
    </div>`).join('');
  document.querySelectorAll('[data-trim]').forEach(b => b.setAttribute('aria-pressed', b.dataset.trim == trim));
  document.querySelectorAll('[data-cw]').forEach(b => b.setAttribute('aria-pressed', b.dataset.cw == cw));
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-trim]'), c = e.target.closest('[data-cw]');
  if (t) { trim = +t.dataset.trim; render(); }
  if (c) { cw = +c.dataset.cw; render(); }
  if (e.target.closest('#navMobile a')) closeNav();

  const dialog = el('contactDialog');
  if (e.target.closest('[data-open-contact]')) { closeNav(); dialog.showModal(); }
  // A click landing on the dialog element itself is a click on the backdrop.
  if (e.target === dialog || e.target.closest('#contactClose')) dialog.close();
});

function closeNav() {
  el('navMobile').classList.remove('open');
  el('navToggle').setAttribute('aria-expanded', 'false');
}
el('navToggle').addEventListener('click', () => {
  const open = el('navMobile').classList.toggle('open');
  el('navToggle').setAttribute('aria-expanded', open);
});

render();
</script>
</body>
</html>
