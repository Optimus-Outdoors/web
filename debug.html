<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Layout debug</title>
<style>
  body { font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; margin: 0; display: flex; height: 100vh; }
  #frame { width: 390px; border: 0; border-right: 2px solid #333; flex: 0 0 390px; height: 100%; }
  #out { flex: 1 1 auto; padding: 16px; overflow: auto; white-space: pre-wrap; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  .bad { color: #b00; font-weight: 700; }
  .ok { color: #070; font-weight: 700; }
</style>
</head>
<body>
<iframe id="frame" src="index.html"></iframe>
<div id="out">measuring…</div>
<script>
// Renders index.html at phone width and reports anything extending below the
// footer. Delete this file once the layout bug is fixed.
document.getElementById('frame').addEventListener('load', () => {
  setTimeout(report, 600);   // let fonts and the render pass settle
});

function report() {
  const w = frame.contentWindow, d = w.document, root = d.documentElement;
  const footer = d.querySelector('footer');
  const lines = [];
  if (!footer) { out.textContent = 'no footer found'; return; }

  const footerEnd = footer.getBoundingClientRect().bottom + w.scrollY;
  const scrollH = root.scrollHeight;
  const slack = Math.round(scrollH - footerEnd);

  lines.push('viewport width   ' + root.clientWidth);
  lines.push('scrollHeight     ' + scrollH);
  lines.push('footer ends at   ' + Math.round(footerEnd));
  lines.push('slack below      ' + slack + 'px');
  lines.push('');

  const offenders = [];
  d.querySelectorAll('*').forEach(el => {
    const r = el.getBoundingClientRect();
    const bottom = r.bottom + w.scrollY;
    if (bottom > footerEnd + 2 && r.height > 0) {
      const cs = w.getComputedStyle(el);
      if (cs.position === 'fixed') return;   // fixed bars do not extend the page
      offenders.push({ px: Math.round(bottom - footerEnd), el, cs });
    }
  });

  if (!offenders.length) {
    lines.push('No non-fixed element extends past the footer.');
    lines.push('The slack above is therefore page-level, not an element.');
  } else {
    lines.push('Elements past the footer (deepest first):');
    offenders.sort((a, b) => b.px - a.px).slice(0, 15).forEach(o => {
      const id = o.el.id ? '#' + o.el.id : '';
      const cls = typeof o.el.className === 'string' && o.el.className ? '.' + o.el.className.trim().split(/\s+/).join('.') : '';
      lines.push('  +' + o.px + 'px  ' + o.el.tagName.toLowerCase() + id + cls +
                 '  [pos:' + o.cs.position + ' h:' + Math.round(o.el.getBoundingClientRect().height) + ']');
    });
  }

  lines.push('');
  lines.push('Horizontal: scrollWidth ' + root.scrollWidth + ' vs client ' + root.clientWidth +
             (root.scrollWidth > root.clientWidth ? '   <-- overflows sideways' : '   ok'));

  out.innerHTML = '<h1>Layout debug @ 390px</h1>' +
    lines.join('\n').replace(/(slack below\s+)(\d+)px/, (m, a, n) =>
      a + '<span class="' + (+n > 4 ? 'bad' : 'ok') + '">' + n + 'px</span>');
}
</script>
</body>
</html>
